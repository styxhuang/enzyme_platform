version: 1
name: CADD Vina Docking Module Collection 1.3
mxfarch: MXF37
entrypoints:
  - MOD_CADD_VINA_DOCKING_1_3
nodes:
  - vina_docking.MacrosLigandsDocking
ensure:
  clean:
    - vina_docking/ext
  integrity:
    - type: md5
      hash: full-bundles.md5
      optinal: true
    - type: md5
      hash: necessary-bundles.md5
      optinal: false
actions:
  - echo:
      on_load: 'Prepare for MGLTools 1.5.7 ...'
      on_fail: 'Fail to extract MGLTools 1.5.7'
      on_success: 'Prepared.'
    scripts:
      - mkdir -p vina_docking/ext
      - tar -xf bundles/mgltools_x86_64Linux2_1.5.7.tar.gz -C bundles
      - cd bundles/mgltools_x86_64Linux2_1.5.7 && bash ./install.sh -d ../../vina_docking/ext/MGLTools
  - echo:
      on_load: 'Prepare for AutoDock Vina 1.2.3'
      on_fail: 'Fail to extract Vina 1.2.3'
      on_success: 'Prepared.'
    scripts:
      - tar -xf bundles/vina_1.2.3_linux_x86_64.tar.xz --no-same-owner -C vina_docking/ext
      - ln -s ./vina_1.2.3_linux_x86_64 vina_docking/ext/vina/1.2.3/vina
  - echo:
      on_load: 'Prepare for ADFR suite 1.0'
      on_fail: 'Fail to extract ADFR suite 1.0'
      on_success: 'Prepared.'
    scripts:
      - tar -xf bundles/ADFRsuite_x86_64Linux_1.0.tar.gz -C bundles
      - patch bundles/ADFRsuite_x86_64Linux_1.0/Tools/install.py patches/ADFRsuite_install_py.patch
      - cd bundles/ADFRsuite_x86_64Linux_1.0 && bash ./install.sh -d ../../vina_docking/ext/ADFRsuite
  - echo:
      on_load: 'Prepare for FPocket 4.0.3'
      on_fail: 'Fail to extract FPocket 4.0.3'
      on_success: 'Prepared.'
    scripts:
      - tar -xf bundles/fpocket-4.0.3.tar.xz --no-same-owner -C vina_docking/ext
