image: harbor.maxflow.neotrident/gitlab-ci/python:3.7-slim-xz-zstd-patch

stages:
    - test
    - publish

variables:
  DEPLOY_PLACE: ${DEPLOY_ROOT_DIR__CODES}/cadd_vina_docking_modules_1_3

c-extension-build-py37:
    stage: test
    tags:
        - suzhou
    image: harbor.maxflow.neotrident/gitlab-ci/pybind11-openbabel3:py37-2
    script:
        - . ~/.bashrc
        - conda activate env
        - export CPATH=/opt/conda/envs/env/include
        - make
    artifacts:
      paths:
        - vina_docking/_vina_engine.cpython-37m-x86_64-linux-gnu.so

test-py37:
    stage: test
    tags: 
        - suzhou
    needs:
        - c-extension-build-py37
    before_script:
        - sed -i "s#https://pypi.tuna.tsinghua.edu.cn#http://${PYPI_PROXY}#g" requirements.txt
        - pip install -r requirements.txt --trusted-host ${PYPI_PROXY}
        - pip install -i http://${PYPI_PROXY}/simple "h5py<3.0.0" "mxf-files<1.0.0" mxf-sml "mxf-serum>1.0.0" --trusted-host ${PYPI_PROXY}
        - pip install -i http://${PYPI_PROXY}/simple pyyaml --trusted-host ${PYPI_PROXY}
    script:
        - apt update
        - apt install -y bzip2 openbabel
        - echo y | serum_cli install > install.log
        - pip install -i http://${PYPI_PROXY}/simple coverage --trusted-host ${PYPI_PROXY}
        - coverage run -m unittest discover tests > unittest.log
        - coverage report --omit=*/mxf_serum/*,*/mxf_files/*,*/mxf_sml/*
        - coverage xml
    coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
    artifacts:
      reports:
        coverage_report:
          coverage_format: cobertura
          path: coverage.xml
      paths:
        - install.log
        - unittest.log

style:
    stage: test
    tags:
        - suzhou
    before_script:
        - sed -i "s#https://pypi.tuna.tsinghua.edu.cn#http://${PYPI_PROXY}#g" requirements.txt
        - pip install -r requirements.txt --trusted-host ${PYPI_PROXY}
        - pip install -i http://${PYPI_PROXY}/simple "h5py<3.0.0" "mxf-files<1.0.0" mxf-sml "mxf-serum<1.0.0" --trusted-host ${PYPI_PROXY}
    script:
        - pip install -i http://${PYPI_PROXY}/simple flake8 --trusted-host ${PYPI_PROXY}
        - flake8

publish:
    stage: publish
    image: harbor.maxflow.neotrident/gitlab-ci/rsync
    rules:
        - if: $CI_COMMIT_BRANCH =~ /^release/
    tags: 
        - suzhou
    before_script:
        - chmod 0600 ${DEPLOY_SSH_PUBKEY}
        - export SSH_JUMP="ssh -i ${DEPLOY_SSH_PUBKEY} -o StrictHostKeychecking=no"
        - export RSYNCOPT=(-avvz -e "${SSH_JUMP}" --bwlimit=20m --delete --exclude=".[!.]*")
        - export RSYNCTGT="${DEPLOY_SSH_USER}@${DEPLOY_SERVER}:${DEPLOY_PLACE}"
        - chmod -R g-w .
        - chmod -R o-w .
    script:
        - echo "Current commit SHA ${CI_COMMIT_SHA}" > MANIFESTO
        - echo "This commit made at ${CI_COMMIT_TIMESTAMP}" >> MANIFESTO
        - rsync "${RSYNCOPT[@]}" . ${RSYNCTGT}

document:
    stage: publish
    before_script:
        - sed -i "s#https://pypi.tuna.tsinghua.edu.cn#http://${PYPI_PROXY}#g" requirements.txt
        - pip install -r requirements.txt --trusted-host ${PYPI_PROXY}
        - pip install -i http://${PYPI_PROXY}/simple "h5py<3.0.0" "mxf-files<1.0.0" mxf-sml mxf-serum[autoreport] --trusted-host ${PYPI_PROXY}
    script:
        - apt update
        - apt install -y bzip2 openbabel
        - echo y | serum_cli install
        - serum_cli reporter
    artifacts:
      paths:
        - Unittest Report.docx
        - Design Brief Report.docx
